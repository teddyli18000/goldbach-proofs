name: BMOR quotient sieve invariant
on:
  push:
    branches: [ci/bmor-quotient-sieve-invariant-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - name: Verify sieve invariant
        working-directory: lean
        run: |
          lake exe cache get
          lake env lean ../research/bmor-psi/QuotientSieve.lean
